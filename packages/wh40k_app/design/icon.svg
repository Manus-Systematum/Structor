<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    App icon: a crested helm as a hard-edged insignia, in profile facing left.

    Profile keeps both halves of the brief legible — visored faceplate at the
    front, flared neck guard at the back, crest over the dome.

    Why this is a stencil rather than an illustration. Seven passes of shaded
    representational SVG failed the same way each time: mid-tone panels muddied
    into a blob and the crest read as a cap, a handle or a hood. Two rules fix
    it, and both are what emblem design does anyway:

      1. FACETS, NOT CURVES. Straight segments and a faceted dome. Freehand
         beziers typed blind produce shapes that are almost right, which is
         worse than shapes that are obviously deliberate.
      2. SEPARATE WITH CUTS, NOT TONES. Every internal division is a
         background-coloured gap, not a different grey. Tonal panels vanish at
         60px; negative space survives at any size.

    Original artwork. Roman helmet forms are public domain and the sci-fi notes
    are generic, which matters for the app's most visible surface.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2C2456"/>
      <stop offset="0.55" stop-color="#171327"/>
      <stop offset="1" stop-color="#09070F"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#8B6BFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8B6BFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="steel" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#F2F5FC"/>
      <stop offset="0.62" stop-color="#C8CFE0"/>
      <stop offset="1" stop-color="#99A1B6"/>
    </linearGradient>

    <linearGradient id="crest" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#C6B2FF"/>
      <stop offset="0.5" stop-color="#8763FF"/>
      <stop offset="1" stop-color="#4A2AC8"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g transform="translate(512 516) scale(1.22) translate(-570 -462)">

    <!-- CREST: an angular fin with a trailing tip, seated on the dome facets. -->
    <path fill="url(#crest)" d="
      M 402 358
      L 420 236
      L 498 172
      L 592 186
      L 630 268
      L 640 366
      L 476 340
      Z"/>
    <!-- Cut separating crest from dome, so it cannot read as a cap. -->
    <path stroke="#171327" stroke-width="14" fill="none" stroke-linejoin="miter"
          d="M 402 358 L 476 340 L 640 366"/>
    <!-- Brush divisions, also cuts. -->
    <g stroke="#171327" stroke-width="12" stroke-linecap="butt">
      <path d="M 450 344 L 466 200"/>
      <path d="M 528 344 L 534 178"/>
      <path d="M 596 356 L 600 216"/>
    </g>

    <!-- HELM: faceted silhouette, neck guard included in the same path. -->
    <path fill="url(#steel)" d="
      M 300 388
      L 360 366
      L 476 340
      L 600 352
      L 716 416
      L 760 520
      L 716 618
      L 872 700
      L 836 774
      L 676 692
      L 664 714
      L 556 750
      L 352 728
      L 292 660
      L 268 556
      Z"/>

    <!-- VISOR: a clean slot cut through the faceplate. -->
    <path fill="#171327" d="M 276 470 L 486 442 L 494 528 L 284 556 Z"/>
    <path fill="#8FE0F8" d="M 300 484 L 468 462 L 472 508 L 304 530 Z"/>
    <path fill="#F0FCFF" d="M 304 488 L 452 468 L 454 484 L 306 504 Z"/>

    <!-- Cut separating the faceplate from the rear shell. -->
    <path stroke="#171327" stroke-width="16" fill="none" stroke-linecap="butt"
          d="M 586 352 L 596 744"/>

    <!-- Cut defining the cheek guard against the jaw. -->
    <path stroke="#171327" stroke-width="16" fill="none" stroke-linecap="butt"
          d="M 386 580 L 402 730"/>

    <!-- Cuts defining the snout, with respirator vents. -->

    <g stroke="#171327" stroke-width="15" stroke-linecap="butt">
      <path d="M 288 596 L 368 592"/>
      <path d="M 296 632 L 372 628"/>
      <path d="M 310 668 L 376 664"/>
    </g>

    <!-- Cuts ribbing the neck guard. -->
    <g stroke="#171327" stroke-width="16" stroke-linecap="butt">
      <path d="M 736 640 L 846 700"/>
      <path d="M 712 676 L 822 740"/>
    </g>
  </g>
</svg>
