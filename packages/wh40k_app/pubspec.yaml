name: wh40k_app
description: Warhammer 40,000 11th edition companion — army builder and play mode.
publish_to: none
# The part after "+" is the build number. App Store Connect refuses a build
# number it has already accepted, so increment it on EVERY upload — even when
# the version before it is unchanged.
version: 0.1.0+2

environment:
  sdk: ^3.4.0

dependencies:
  drift: ^2.34.3
  flutter:
    sdk: flutter
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3_flutter_libs: ^0.6.0+eol
  wh40k_core:
    path: ../wh40k_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    # A roster and its self-contained snapshot (DESIGN.md §2.2). The app reads
    # its content from the snapshot rather than a faction dataset, which is the
    # same path an imported or QR-scanned list takes — and it keeps the app
    # independent of the gitignored upstream data.
    - assets/reference_roster.json
    - assets/reference_snapshot.json
    # Dataset bundles (DESIGN.md §3.4). Shipped so the app works offline on
    # first launch; the same files can be served over HTTP and cached, and the
    # repository takes whichever is newest. 40kdc-data, CC BY 4.0.
    - assets/bundles/
