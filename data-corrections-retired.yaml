# Corrections that no longer apply, and why.
#
# Hand-written, unlike data-conflicts.json, which bin/merge.dart regenerates
# and would overwrite. Kept because a correction is a recorded observation —
# usually someone's table experience — and deleting it loses the observation
# along with the entry (DESIGN.md §3.10).

retired:

  - faction: tau-empire
    id: ghostkeel-battlesuit
    was: "add_wargear: [battlesuit-support-system]"
    outcome: retired
    reason: >
      BSData carries the support system on the datasheet.

  - faction: tau-empire
    id: commander-in-coldstar-battlesuit
    was: "standard_wargear: [shield-generator]"
    outcome: retired
    reason: >
      Written against 40kdc, which listed the Shield Generator BOTH as a
      standard ability and as a wargear option — so the app could not tell
      whether a list that never bought one had a 4+ invulnerable save, and
      the entry picked "standard" to make the statline and the rules agree.
      Its own note said this was the line to change if a Coldstar has to pay
      for it.

      BSData settles it: the Shield Generator is a wargear option on this
      datasheet and on the Enforcer, and on neither is it standard. The
      correction was making an option always-on, so the unit card listed
      "Shield Generator: the bearer has a 4+ invulnerable save" and the
      statline showed INV 4+ on a Commander that had not bought one.
      Reported by the app's user, who fields the army.


# Narrowed rather than retired: BSData covers part of what the correction
# added, and the reference export — a validated 2,000 point list that prices
# to its printed total — still contradicts BSData on the rest. These are the
# places §3.10's "BSData wins" is overridden, and only on that evidence.
narrowed:
  - faction: tau-empire
    id: commander-in-enforcer-battlesuit
    was: "add_wargear: [gun-drone, shield-drone]"
    now: "add_wargear: [gun-drone]"
    reason: BSData carries the shield drone; it has no gun drone.

  - faction: tau-empire
    id: commander-in-coldstar-battlesuit
    was: "add_wargear: [gun-drone, shield-drone]"
    now: "add_wargear: [gun-drone]"
    reason: As the Enforcer.

  - faction: tau-empire
    id: stealth-battlesuits
    was: "add_wargear: [gun-drone, marker-drone]"
    now: "add_wargear: [gun-drone]"
    reason: BSData carries the marker drone.

  - faction: tau-empire
    id: crisis-fireknife-battlesuits
    was: "add_wargear: [gun-drone, shield-drone]"
    now: "add_wargear: [gun-drone]"
    reason: >
      BSData carries the shield drone as an ability and the gun drone only in
      the wargear budget. The importer resolves a drone by its ability, so the
      budget alone is not enough.

  - faction: tau-empire
    id: crisis-starscythe-battlesuits
    was: "add_wargear: [gun-drone, shield-drone]"
    now: "add_wargear: [gun-drone]"
    reason: As the Fireknife.

  - faction: tau-empire
    id: broadside-battlesuits
    was: "add_wargear: [missile-drone]"
    now: "add_wargear: [missile-drone]"
    reason: >
      Unchanged. BSData lists marker, shield and guardian drones here and no
      missile drone; the export lists two missile drones on each Broadside.
