enhancements:
  - faction: tau-empire
    id: negation-emitters-upgrade-advanced-acquisition-cadre
    reason: >
      A Unit Upgrade for Stealth Battlesuits. Upstream carries only the
      faction keyword, so the builder offered it on every Character in the
      list. Reported by the app's user, who fields the army.
    upstream: not yet reported
    restrict_to: [stealth-battlesuits]

  - faction: tau-empire
    id: unmasking-suite-upgrade-advanced-acquisition-cadre
    reason: >
      A Unit Upgrade for Pathfinders or Stealth Battlesuits — two datasheets,
      which is why this is a list rather than a keyword. Reported by the app's
      user, who fields the army.
    upstream: not yet reported
    restrict_to: [pathfinder-team, stealth-battlesuits]

aliases:
  - faction: "*"
    id: slayers-of-tyrants-gilded-blades
    canonical: slayers-of-tyrants
    reason: >
      One rule under two ids, which arrived with the 2026-09 data. Both are
      named "Slayers of Tyrants"; the detachment-suffixed one carries no text
      at all, so a unit that has it renders a rule name with nothing under it
      while the other id holds the wording. Merged rather than corrected
      upstream-side because the pair is the split, not either half.
    upstream: not yet reported

  - faction: "*"
    id: battlesuit-support-systems
    canonical: battlesuit-support-system
    reason: >
      Crisis Starscythe Battlesuits carry "Battlesuit Support Systems" while
      the Ghostkeel and Riptide carry "Battlesuit Support System". Both encode
      the same effect — may act normally after Falling Back — and the rulebook
      names one rule.
    upstream: not yet reported

  - faction: "*"
    id: weapon-support-systems
    canonical: weapon-support-system
    reason: >
      Crisis Fireknife Battlesuits carry "Weapon Support Systems" while the
      Riptide carries "Weapon Support System". Both encode ignoring modifiers
      to all rolls in the Shooting phase.
    upstream: not yet reported

  - faction: "*"
    id: support-system
    canonical: weapon-support-system
    reason: >
      The Stormsurge's "Support System" encodes exactly what the Riptide's
      "Weapon Support System" does — ignore modifiers to all rolls in the
      Shooting phase — and the two records are otherwise identical. Upstream
      abbreviates the name on this one datasheet. Confirmed as the same rule
      by the app's user against the rulebook.
    upstream: not yet reported

  # The three below turned up when the remaining thirty-two factions were
  # ingested. All are the same shape as the T'au ones above — one rule
  # transcribed per datasheet, and the datasheets disagree about the plural —
  # and all three were found by the duplicate-fingerprint test rather than by
  # reading, which is the point of having it.
  - faction: "*"
    id: cherubs
    canonical: cherub
    reason: >
      One datasheet carries "Cherubs" and another "Cherub", with identical
      effect records. Left split, the rules screen files the same sentence
      under two ids and neither reads as shared.
    upstream: not yet reported

  - faction: "*"
    id: mobile-hunter-killers
    canonical: mobile-hunter-killer
    reason: >
      "Mobile Hunter-killers" and "Mobile Hunter-killer" encode the same
      effect; upstream pluralises on the datasheets that mount more than one.
    upstream: not yet reported

  - faction: "*"
    id: bomb-squigs
    canonical: bomb-squig
    reason: >
      "Bomb Squigs" and "Bomb Squig" encode the same effect. Same plural
      split as the two above.
    upstream: not yet reported

  - faction: "*"
    id: leader-beasts
    canonical: leader-beast
    reason: >
      BSData carries the rule under both spellings, and now that a faction's
      index resolves links into sibling catalogues both reach every faction.
      Left alone §7.3.9 counts them as two unshared rules and files the same
      sentence twice on the rules screen.
    upstream: not yet reported

  - faction: "*"
    id: dark-blessings
    canonical: dark-blessing
    reason: >
      The same, and from the same source.
    upstream: not yet reported

  - faction: "*"
    id: predatory-instincts
    canonical: predatory-instinct
    reason: >
      Both spellings, from a shared catalogue.
    upstream: not yet reported

