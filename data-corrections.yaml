abilities:
  # `faction: "*"` matches the ability in every faction that carries it. Core
  # abilities are transcribed once per faction file, so a mistake in one is
  # usually a mistake in all of them.
  - faction: "*"
    id: stealth
    reason: >
      In 11th edition Stealth gives the unit the Benefit of Cover. Upstream
      still carries the 10th edition rule, -1 to the attacker's Hit roll, in
      all three faction files. Reported by the app's user against the current
      rulebook. The two are not interchangeable: cover changes the save, a hit
      penalty changes the roll, and they stack differently with everything
      else on the table.
    upstream: not yet reported
    effect:
      type: cover-benefit
      target: unit

  - faction: tau-empire
    id: gun-drone
    reason: >
      A Gun Drone brings a twin pulse carbine. Upstream records only
      `{grant_type: ranged-weapon}` with no weapon named, so the app could say
      "grants a ranged weapon" and nothing more — no profile, no attacks, and
      nothing in the shooting table. The Recon Drone in the same file shows
      the intended shape, with an explicit weapon_id.
    upstream: not yet reported
    effect:
      type: ability-grant
      target: bearer
      modifier:
        grant_type: weapon-grant
        weapon_id: drone-twin-pulse-carbine
        count: 1

  - faction: tau-empire
    id: mv15-gun-drone
    reason: >
      Names the weapon by id rather than as free text, so the grant resolves
      to a profile the shooting table can show.
    upstream: not yet reported
    effect:
      type: ability-grant
      target: bearer
      modifier:
        grant_type: weapon-grant
        weapon_id: twin-pulse-blaster
        count: 1

  - faction: tau-empire
    id: missile-drone
    reason: >
      Names the weapon the drone brings, as the Recon Drone already does.
      Without a weapon_id the grant is unresolvable and the drone's shots
      never reach the table.
    upstream: not yet reported
    effect:
      type: ability-grant
      target: bearer
      modifier:
        grant_type: weapon-grant
        weapon_id: drone-missile-pod
        count: 1

  - faction: tau-empire
    id: coldstar-commander
    reason: >
      While the Commander leads a unit, the whole squad's ranged weapons gain
      ASSAULT as well as moving 12". Upstream carries only the Move part, so
      the app showed a mobility buff and said nothing about being able to
      shoot after Advancing — which is the reason to take the detachment.
    upstream: not yet reported
    effect:
      type: conditional
      condition:
        type: is-attached
      effect:
        type: sequence
        steps:
          - type: stat-modifier
            target: unit
            modifier:
              stat: M
              operation: set
              value: 12
          - type: weapon-keyword-grant
            target: unit
            modifier:
              weapon_type: ranged
              keywords:
                - assault

  - faction: tau-empire
    id: starscythe
    reason: >
      The AP improvement does not apply against VEHICLE or MONSTER targets.
      Upstream has no restriction, so the app promised -1 AP against exactly
      the targets where it does not help.
    upstream: not yet reported
    effect:
      type: conditional
      condition:
        operator: and
        operands:
          - type: phase-is
            parameters:
              phase: shooting
          - type: target-has-keyword
            parameters:
              excluded_keywords:
                - vehicle
                - monster
      effect:
        type: stat-modifier
        target: unit
        modifier:
          stat: AP
          operation: add
          value: -1

  - faction: tau-empire
    id: advanced-armour
    reason: >
      Advanced Armour is Feel No Pain 4+ against mortal wounds only. The
      upstream effect has no qualifier, so the app rendered an unrestricted
      Feel No Pain 4+ — a much stronger ability than the Broadside has, and
      exactly the kind of confidently wrong number that loses games.
    upstream: not yet reported
    effect:
      type: conditional
      condition:
        type: damage-is-mortal
      effect:
        type: feel-no-pain
        target: unit
        modifier:
          threshold: 4

# Weapon records upstream is missing. An ability can name a weapon that does
# not exist — the Recon Drone grants `drone-burst-cannon` and no such record is
# in the file — and then the grant resolves to nothing at all.
#
# `derive_from` builds the record from another weapon rather than restating it.
# A drone's gun is its namesake fired worse: same profile, BS5+. Saying that,
# instead of copying the stat block, keeps the drone in step when upstream
# revises the original.
weapons:
  - faction: tau-empire
    id: drone-missile-pod
    reason: >
      The Missile Drone's gun: a missile pod at BS5+. Upstream records the
      drone as granting `{grant_type: ranged-weapon}` with no weapon named and
      has no record for it either, so Broadsides and Riptides were fielding
      drones that shot nothing.
    upstream: not yet reported
    derive_from: missile-pod
    name: Drone missile pod
    override_stats:
      BS: 5

  - faction: tau-empire
    id: drone-burst-cannon
    reason: >
      The Recon Drone's gun, already named by that ability but with no record
      anywhere in the file. A burst cannon at BS5+.
    upstream: not yet reported
    derive_from: burst-cannon
    name: Drone burst cannon
    override_stats:
      BS: 5

  - faction: tau-empire
    id: drone-twin-pulse-carbine
    reason: >
      The Gun Drone's gun. Pointing the grant at the plain `twin-pulse-carbine`
      had the drone firing at BS4+, the skill of the battlesuit carrying it,
      which is a better weapon than the drone has.
    upstream: not yet reported
    derive_from: twin-pulse-carbine
    name: Drone twin pulse carbine
    override_stats:
      BS: 5

  - faction: tau-empire
    id: twin-pulse-blaster
    reason: >
      The MV15 Gun Drone's gun, carried by The Twin Lance. Upstream names it
      only as free text — "twin pulse blaster" — with no record to resolve.
      Written out rather than derived: the profile confirmed against the
      datasheet is 12" with TWIN LINKED, where upstream's `pulse-blaster` is
      10" without it, so this is not simply its namesake at BS5+.
    upstream: not yet reported
    weapon:
      name: Twin pulse blaster
      type: ranged
      profiles:
        - name: Twin pulse blaster
          range: 12
          stats:
            A: 2
            BS: 5
            S: 6
            AP: -1
            D: 1
          keywords:
            - keyword_id: assault
            - keyword_id: twin-linked

# Datasheets that can carry wargear upstream does not list. A drone is an
# ability (what it does) plus a wargear budget entry (that it is a choice),
# and adding both is what lets the app show a drone's rules on the units that
# actually bought one and nowhere else.
units:
  - faction: tau-empire
    id: commander-in-enforcer-battlesuit
    reason: >
      BSData has no Gun Drone on this datasheet, and the reference export — a
      validated 2,000 point list that prices to its printed total — has
      "1x Gun drone with twin pulse carbine" on every Commander in it.
    upstream: not yet reported
    add_wargear: [gun-drone]

  - faction: death-guard
    id: beasts-of-nurgle
    reason: >
      Nobody in the pipeline prices this datasheet. 40kdc does not carry the
      Death Guard copy at all — it came in from BSData, which publishes the
      sheet with no cost, so it shipped at zero and the builder charged
      nothing for it. Games Workshop's own points page prices it at 70 for one
      model and 140 for two; the Chaos Daemons copy of the same datasheet is a
      different unit at a different price (80 / 150) and is not a substitute.
      Transcribed here rather than read out of the Munitorum mirror, because
      the mirror is what judges prices and a price taken from the judge can
      never be judged wrong by it (DESIGN.md §3.5).
    upstream: not yet reported
    points:
      - models: 1
        cost: 70
      - models: 2
        cost: 140

  - faction: adepta-sororitas
    id: dominion-squad
    reason: >
      A Dominion Squad has a Cherub, and upstream lists none. Sanctifiers and
      Retributors both carry the same rule as a standard ability rather than
      a purchased option, so it is added the same way — a Cherub is part of
      the squad, not something bought for it. Reported by the app's user, who
      fields the army; not otherwise verified, since the rules text is not in
      the dataset and §0 keeps it out of this repository.
    upstream: not yet reported
    standard_wargear: [cherub]

  - faction: tau-empire
    id: commander-in-coldstar-battlesuit
    reason: >
      BSData has no Gun Drone on this datasheet, and the reference export — a
      validated 2,000 point list that prices to its printed total — has
      "1x Gun drone with twin pulse carbine" on every Commander in it.
    upstream: not yet reported
    add_wargear: [gun-drone]

# Two ids for one rule. Upstream transcribes an ability once per datasheet, and
# the datasheets disagree about the plural — the effect records are identical.
# §7.3.9 decides whether a rule is shared by counting the datasheets carrying
# its id, so a stray plural splits one shared rule into two unshared ones and
# files the same sentence twice on the rules screen.
#
# The duplicate is dropped and every reference to it rewritten to `canonical`,
# which must already exist upstream.
#
# All of these are `faction: "*"`. They were scoped to the faction that first
# showed the split, which held while each faction's data was read in isolation;
# a faction's index now resolves links into sibling catalogues (§3.10), so a
# rule declared in the Astra Militarum library reaches Genestealer Cults and
# splits there too. An alias is a merge and cannot introduce an id upstream
# does not have, so widening one costs nothing where it does not apply.
  - faction: tau-empire
    id: crisis-fireknife-battlesuits
    reason: >
      Takes a Gun Drone. BSData offers one in the datasheet's wargear budget
      but not among its abilities, and the importer resolves a drone by its
      ability — so "Gun Drone With Twin Pulse Carbine and Shield Drone" landed
      on the shield drone alone and the carbines went missing. The export
      lists one on every Crisis suit in the list.
    upstream: not yet reported
    add_wargear: [gun-drone]

  - faction: tau-empire
    id: crisis-starscythe-battlesuits
    reason: >
      Gun Drone, as for the Fireknife and on the same evidence.
    upstream: not yet reported
    add_wargear: [gun-drone]

  - faction: tau-empire
    id: stealth-battlesuits
    reason: >
      The Shas'vre takes a Gun Drone. BSData offers the marker drone beside it
      but not this; the export lists both on both Stealth teams.
    upstream: not yet reported
    add_wargear: [gun-drone]

  - faction: tau-empire
    id: broadside-battlesuits
    reason: >
      Takes Missile Drones. BSData lists marker, shield and guardian drones
      here instead; the export lists "2x Missile drone" on both Broadsides.
    upstream: not yet reported
    add_wargear: [missile-drone]

  - faction: tau-empire
    id: riptide-battlesuit
    reason: >
      Takes Missile Drones. 40kdc carries them and BSData does not, and
      BSData's ability list replaces 40kdc's wholesale on a merged record, so
      without this the drones are lost rather than merely unlisted. The export
      lists "2x Missile drones" on the first Riptide.
    upstream: not yet reported
    add_wargear: [missile-drone]

# Unit Upgrades restricted to the datasheets they are actually for.
#
# Both of T'au's publish `keyword_restrictions: ["T’au Empire"]` and nothing
# else, so every Character in the army was offered them. A keyword restriction
# cannot express it either — the Unmasking Suite goes on Pathfinders *or*
# Stealth Battlesuits, and restrictions are all required at once — so these
# name the datasheets.
# Rules filed under every phase because the mapping did not know.
#
# `phase-mappings.json` is community-authored, and where it has no answer it
# lists all five phases — which the turn page honours literally, so a rule
# appears in every section instead of the one or two it belongs to. 183 of the
# 3,745 mappings do this, and it is **not** always wrong: `Unholy Vigour` is
# genuinely "at the start of any phase" and `Grotesque Regeneration` "at the
# end of each phase". So the pattern cannot be ignored wholesale; these are
# the ones whose own printed text names the phases outright.
#
# Two more were left alone deliberately. `legacy-of-the-angel` and
# `murderous-agenda` both read "at the start of the first battle round", which
# is not a phase claim their text can settle.
