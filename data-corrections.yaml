# Corrections applied to upstream data when the bundles are built.
#
# The cross-check (DESIGN.md §3.5) finds where two sources disagree. This is
# the other half: where the data is simply wrong or incomplete and a person has
# confirmed it against the book. Corrections are applied by bin/bundle.dart, so
# the shipped bundle is right while the upstream fix is pending.
#
# Every entry needs a reason and should have an upstream report. A correction
# with neither is a private fork nobody can audit.
#
# Delete an entry once upstream carries the fix — leaving it means silently
# overriding data that has since become correct.

abilities:
  # `faction: "*"` matches the ability in every faction that carries it. Core
  # abilities are transcribed once per faction file, so a mistake in one is
  # usually a mistake in all of them.
  - faction: "*"
    id: stealth
    reason: >
      In 11th edition Stealth gives the unit the Benefit of Cover. Upstream
      still carries the 10th edition rule, -1 to the attacker's Hit roll, in
      all three faction files. Reported by the app's user against the current
      rulebook. The two are not interchangeable: cover changes the save, a hit
      penalty changes the roll, and they stack differently with everything
      else on the table.
    upstream: not yet reported
    effect:
      type: cover-benefit
      target: unit

  - faction: tau-empire
    id: gun-drone
    reason: >
      A Gun Drone brings a twin pulse carbine. Upstream records only
      `{grant_type: ranged-weapon}` with no weapon named, so the app could say
      "grants a ranged weapon" and nothing more — no profile, no attacks, and
      nothing in the shooting table. The Recon Drone in the same file shows
      the intended shape, with an explicit weapon_id.
    upstream: not yet reported
    effect:
      type: ability-grant
      target: bearer
      modifier:
        grant_type: weapon-grant
        weapon_id: drone-twin-pulse-carbine
        count: 1

  - faction: tau-empire
    id: mv15-gun-drone
    reason: >
      Names the weapon by id rather than as free text, so the grant resolves
      to a profile the shooting table can show.
    upstream: not yet reported
    effect:
      type: ability-grant
      target: bearer
      modifier:
        grant_type: weapon-grant
        weapon_id: twin-pulse-blaster
        count: 1

  - faction: tau-empire
    id: missile-drone
    reason: >
      Names the weapon the drone brings, as the Recon Drone already does.
      Without a weapon_id the grant is unresolvable and the drone's shots
      never reach the table.
    upstream: not yet reported
    effect:
      type: ability-grant
      target: bearer
      modifier:
        grant_type: weapon-grant
        weapon_id: drone-missile-pod
        count: 1

  - faction: tau-empire
    id: coldstar-commander
    reason: >
      While the Commander leads a unit, the whole squad's ranged weapons gain
      ASSAULT as well as moving 12". Upstream carries only the Move part, so
      the app showed a mobility buff and said nothing about being able to
      shoot after Advancing — which is the reason to take the detachment.
    upstream: not yet reported
    effect:
      type: conditional
      condition:
        type: is-attached
      effect:
        type: sequence
        steps:
          - type: stat-modifier
            target: unit
            modifier:
              stat: M
              operation: set
              value: 12
          - type: weapon-keyword-grant
            target: unit
            modifier:
              weapon_type: ranged
              keywords:
                - assault

  - faction: tau-empire
    id: starscythe
    reason: >
      The AP improvement does not apply against VEHICLE or MONSTER targets.
      Upstream has no restriction, so the app promised -1 AP against exactly
      the targets where it does not help.
    upstream: not yet reported
    effect:
      type: conditional
      condition:
        operator: and
        operands:
          - type: phase-is
            parameters:
              phase: shooting
          - type: target-has-keyword
            parameters:
              excluded_keywords:
                - vehicle
                - monster
      effect:
        type: stat-modifier
        target: unit
        modifier:
          stat: AP
          operation: add
          value: -1

  - faction: tau-empire
    id: advanced-armour
    reason: >
      Advanced Armour is Feel No Pain 4+ against mortal wounds only. The
      upstream effect has no qualifier, so the app rendered an unrestricted
      Feel No Pain 4+ — a much stronger ability than the Broadside has, and
      exactly the kind of confidently wrong number that loses games.
    upstream: not yet reported
    effect:
      type: conditional
      condition:
        type: damage-is-mortal
      effect:
        type: feel-no-pain
        target: unit
        modifier:
          threshold: 4

# Weapon records upstream is missing. An ability can name a weapon that does
# not exist — the Recon Drone grants `drone-burst-cannon` and no such record is
# in the file — and then the grant resolves to nothing at all.
#
# `derive_from` builds the record from another weapon rather than restating it.
# A drone's gun is its namesake fired worse: same profile, BS5+. Saying that,
# instead of copying the stat block, keeps the drone in step when upstream
# revises the original.
weapons:
  - faction: tau-empire
    id: drone-missile-pod
    reason: >
      The Missile Drone's gun: a missile pod at BS5+. Upstream records the
      drone as granting `{grant_type: ranged-weapon}` with no weapon named and
      has no record for it either, so Broadsides and Riptides were fielding
      drones that shot nothing.
    upstream: not yet reported
    derive_from: missile-pod
    name: Drone missile pod
    override_stats:
      BS: 5

  - faction: tau-empire
    id: drone-burst-cannon
    reason: >
      The Recon Drone's gun, already named by that ability but with no record
      anywhere in the file. A burst cannon at BS5+.
    upstream: not yet reported
    derive_from: burst-cannon
    name: Drone burst cannon
    override_stats:
      BS: 5

  - faction: tau-empire
    id: drone-twin-pulse-carbine
    reason: >
      The Gun Drone's gun. Pointing the grant at the plain `twin-pulse-carbine`
      had the drone firing at BS4+, the skill of the battlesuit carrying it,
      which is a better weapon than the drone has.
    upstream: not yet reported
    derive_from: twin-pulse-carbine
    name: Drone twin pulse carbine
    override_stats:
      BS: 5

  - faction: tau-empire
    id: twin-pulse-blaster
    reason: >
      The MV15 Gun Drone's gun, carried by The Twin Lance. Upstream names it
      only as free text — "twin pulse blaster" — with no record to resolve.
      Written out rather than derived: the profile confirmed against the
      datasheet is 12" with TWIN LINKED, where upstream's `pulse-blaster` is
      10" without it, so this is not simply its namesake at BS5+.
    upstream: not yet reported
    weapon:
      name: Twin pulse blaster
      type: ranged
      profiles:
        - name: Twin pulse blaster
          range: 12
          stats:
            A: 2
            BS: 5
            S: 6
            AP: -1
            D: 1
          keywords:
            - keyword_id: assault
            - keyword_id: twin-linked

# Datasheets that can carry wargear upstream does not list. A drone is an
# ability (what it does) plus a wargear budget entry (that it is a choice),
# and adding both is what lets the app show a drone's rules on the units that
# actually bought one and nowhere else.
units:
  - faction: tau-empire
    id: commander-in-enforcer-battlesuit
    reason: >
      Commander battlesuits take drones. Upstream lists neither the abilities
      nor the wargear budget, so a Commander's Gun Drone was dropped on import
      — its twin pulse carbine missing from the shooting table and its Shield
      Drone missing from the rules. Evidenced by a validated War Organ export
      of a legal 2,000 point list.
    upstream: not yet reported
    add_wargear: [gun-drone, shield-drone]

  - faction: tau-empire
    id: commander-in-coldstar-battlesuit
    reason: >
      Drones as for the Enforcer Commander. The Shield Generator is a separate
      problem: upstream lists it BOTH as a standard ability and as a wargear
      option, so the app could not tell whether a list that never mentions
      buying one has a 4+ invulnerable save. Treated as standard, which is
      what the ability list implies and what makes the statline agree with
      the rules text. If a Coldstar has to pay for its Shield Generator, this
      entry is the thing to change.
    upstream: not yet reported
    add_wargear: [gun-drone, shield-drone]
    standard_wargear: [shield-generator]

  - faction: tau-empire
    id: crisis-starscythe-battlesuits
    reason: >
      Crisis Starscythe suits take the same drones as Crisis Fireknife suits,
      whose datasheet does list them. The omission looks like a transcription
      slip rather than a rule.
    upstream: not yet reported
    add_wargear: [gun-drone, shield-drone]

  - faction: tau-empire
    id: stealth-battlesuits
    reason: >
      Stealth Battlesuits take a Gun Drone and a Marker Drone. Both abilities
      exist in the faction data; neither is attached to this datasheet.
    upstream: not yet reported
    add_wargear: [gun-drone, marker-drone]

  - faction: tau-empire
    id: broadside-battlesuits
    reason: >
      Broadsides take Missile Drones. The ability exists and is attached to
      the Riptide, but not here.
    upstream: not yet reported
    add_wargear: [missile-drone]

  - faction: tau-empire
    id: ghostkeel-battlesuit
    reason: >
      The Ghostkeel takes a Battlesuit Support System. The ability exists and
      is attached to other battlesuits, but not to this one.
    upstream: not yet reported
    add_wargear: [battlesuit-support-system]

# Two ids for one rule. Upstream transcribes an ability once per datasheet, and
# the datasheets disagree about the plural — the effect records are identical.
# §7.3.9 decides whether a rule is shared by counting the datasheets carrying
# its id, so a stray plural splits one shared rule into two unshared ones and
# files the same sentence twice on the rules screen.
#
# The duplicate is dropped and every reference to it rewritten to `canonical`,
# which must already exist upstream.
aliases:
  - faction: tau-empire
    id: battlesuit-support-systems
    canonical: battlesuit-support-system
    reason: >
      Crisis Starscythe Battlesuits carry "Battlesuit Support Systems" while
      the Ghostkeel and Riptide carry "Battlesuit Support System". Both encode
      the same effect — may act normally after Falling Back — and the rulebook
      names one rule.
    upstream: not yet reported

  - faction: tau-empire
    id: weapon-support-systems
    canonical: weapon-support-system
    reason: >
      Crisis Fireknife Battlesuits carry "Weapon Support Systems" while the
      Riptide carries "Weapon Support System". Both encode ignoring modifiers
      to all rolls in the Shooting phase.
    upstream: not yet reported

  - faction: tau-empire
    id: support-system
    canonical: weapon-support-system
    reason: >
      The Stormsurge's "Support System" encodes exactly what the Riptide's
      "Weapon Support System" does — ignore modifiers to all rolls in the
      Shooting phase — and the two records are otherwise identical. Upstream
      abbreviates the name on this one datasheet. Confirmed as the same rule
      by the app's user against the rulebook.
    upstream: not yet reported

  # The three below turned up when the remaining thirty-two factions were
  # ingested. All are the same shape as the T'au ones above — one rule
  # transcribed per datasheet, and the datasheets disagree about the plural —
  # and all three were found by the duplicate-fingerprint test rather than by
  # reading, which is the point of having it.
  - faction: adepta-sororitas
    id: cherubs
    canonical: cherub
    reason: >
      One datasheet carries "Cherubs" and another "Cherub", with identical
      effect records. Left split, the rules screen files the same sentence
      under two ids and neither reads as shared.
    upstream: not yet reported

  - faction: astra-militarum
    id: mobile-hunter-killers
    canonical: mobile-hunter-killer
    reason: >
      "Mobile Hunter-killers" and "Mobile Hunter-killer" encode the same
      effect; upstream pluralises on the datasheets that mount more than one.
    upstream: not yet reported

  - faction: orks
    id: bomb-squigs
    canonical: bomb-squig
    reason: >
      "Bomb Squigs" and "Bomb Squig" encode the same effect. Same plural
      split as the two above.
    upstream: not yet reported
