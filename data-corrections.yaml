# Corrections applied to upstream data when the bundles are built.
#
# The cross-check (DESIGN.md §3.5) finds where two sources disagree. This is
# the other half: where the data is simply wrong or incomplete and a person has
# confirmed it against the book. Corrections are applied by bin/bundle.dart, so
# the shipped bundle is right while the upstream fix is pending.
#
# Every entry needs a reason and should have an upstream report. A correction
# with neither is a private fork nobody can audit.
#
# Delete an entry once upstream carries the fix — leaving it means silently
# overriding data that has since become correct.

# ---------------------------------------------------------------------------
# Weapon slots for datasheets BSData does not structure (DESIGN.md §4.20).
#
# Where BSData gives a datasheet slots, they replace 40kdc's options — which
# multiply a model's independent swaps into combined bundles. Where it gives
# none, 40kdc's options are all there is, bundles included. An entry here
# states the printed swaps as slots, so the loadout drops the bundle over the
# same weapons exactly as it does elsewhere. Transcribed from the printed
# options, never from memory (§0).
wargear_slots:
  - faction: "*"
    id: deathwatch-veterans
    reason: >
      Printed: "The Watch Sergeant's power weapon can be replaced with 1
      xenophase blade" and "The Watch Sergeant's boltgun can be replaced with
      1 combi-weapon" — two independent swaps. 40kdc publishes them as a
      single [xenophase blade, combi-weapon] bundle, so the editor offered one
      selector that took both or neither. BSData structures the squad's
      loadouts but gives the Sergeant no slots.
    upstream: not yet reported
    slots:
      - model: Watch Sergeant
        name: Power weapon
        default: [power-weapon]
        choices: [[xenophase-blade]]
        per_models: 1
      - model: Watch Sergeant
        name: Boltgun
        default: [boltgun]
        choices: [[combi-weapon]]
        per_models: 1

# ---------------------------------------------------------------------------
# What a model carries before any option is taken (DESIGN.md §3.42).
#
# Only where two other sources agree against upstream — the codex is not one
# of this project's sources, so a single disagreement is recorded as open in
# DESIGN.md rather than settled here.
compositions:
  - faction: adeptus-astartes
    id: vanguard-veteran-squad-with-jump-packs
    reason: >
      40kdc 1.4.5's codex ingest gives every model a relic blade and nothing
      else. Wahapedia's 11th edition page, already carrying the codex-era
      points (110 / 220), prints "Every model is equipped with: bolt pistol;
      Vanguard Veteran weapon", with the pistol swaps as options, and BSData
      structures the same loadout. Read 2026-10-04.
    upstream: not yet reported
    models:
      - name: Vanguard Veteran Sergeant with Jump Pack
        default_weapon_ids: [bolt-pistol, vanguard-veteran-weapon]
      - name: Vanguard Veteran with Jump Pack
        default_weapon_ids: [bolt-pistol, vanguard-veteran-weapon]

# ---------------------------------------------------------------------------
# Words upstream misspells.
#
# **Found, not judged.** Each of these is a token that is in no dictionary, in
# none of the names the dataset itself publishes, and one keystroke from a word
# the rules text leans on thousands of times. Nothing here was decided by
# somebody thinking a word looked wrong (§0), and the entries say what the
# evidence was so a reader can check it.
#
# Two things this deliberately does not touch:
#
#   - **Rare spellings that are not errors.** `Hypex` is a combat drug,
#     `Kine-shielded Guardians` is a rule and `CORV` is a keyword; all three
#     look like typos to a spell-checker and are correct.
#   - **Formatting.** Curly against straight apostrophes, a trailing full stop
#     present in one copy and absent in another, bold markers on a keyword in
#     one faction's file and not in another's. Those are real inconsistencies
#     and they are not misspellings; normalising them is a separate decision.
#
# Counts are as of 2026-09-11 and will fall as upstream fixes them. An entry
# whose `wrong` no longer appears anywhere should go — `spellings_test.dart`
# fails when one stops matching.
spellings:
  - wrong: abilty
    right: ability
    reason: >
      68 occurrences against 28,565 of
      "ability", and "abilty" is in no dictionary and in none of the
      dataset's own names. First seen in adepta-sororitas/farstryder-node.
